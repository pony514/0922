<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 校園花朵觀察記錄系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-4 flex justify-center items-center">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- 頂部標題列 -->
    <div class="bg-emerald-600 px-6 py-5 text-white">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🌸</span>
        <div>
          <h1 class="text-xl font-bold tracking-wide">校園花朵觀察記錄表</h1>
          <p class="text-xs text-emerald-100 mt-1">自動感測 GPS 與時間，快速寫入 Google 試算表</p>
        </div>
      </div>
    </div>

    <form id="observationForm" class="p-6 space-y-5">
      
      <!-- GAS 部署網址 (自動記住於瀏覽器) -->
      <div>
        <label for="webAppUrl" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
          Google Apps Script 部署網址 <span class="text-red-500">*</span>
        </label>
        <input 
          type="url" 
          id="webAppUrl" 
          placeholder="https://script.google.com/macros/s/AKfycbx.../exec"
          required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-mono focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
        />
        <p class="text-[11px] text-slate-400 mt-1">網址將會自動儲存於您的瀏覽器中，方便下次重複使用。</p>
      </div>

      <!-- 自動感測區塊：GPS 座標與記錄時間提示 -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
        <div class="flex items-center justify-between border-b border-slate-200 pb-2">
          <span class="text-xs font-bold text-slate-600 flex items-center gap-1.5">
            <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            自動獲取資訊
          </span>
          <button type="button" id="reloactionBtn" class="text-xs text-emerald-600 hover:text-emerald-700 font-medium underline flex items-center gap-1">
            <span>重新定位 GPS</span>
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <!-- GPS 座標 -->
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">GPS 座標 (自動感測)</label>
            <input type="text" id="gps" placeholder="抓取定位中..." readonly class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white font-mono text-slate-700 focus:outline-none">
            <p id="gpsStatus" class="text-[11px] text-amber-600 mt-1 font-medium">📡 正在取得 GPS 定位...</p>
          </div>

          <!-- 時間提示 -->
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">觀察時間 (按下送出時抓取)</label>
            <div class="px-3 py-2 border border-slate-200 rounded-lg text-xs bg-slate-100 text-slate-500 flex items-center justify-between">
              <span id="timePreview" class="font-mono">即時自動取得</span>
              <span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded">Auto</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 手動填寫觀察欄位 -->
      <div class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- 校園地點 -->
          <div>
            <label for="location" class="block text-xs font-semibold text-slate-700 mb-1">
              校園地點 <span class="text-red-500">*</span>
            </label>
            <input 
              type="text" 
              id="location" 
              placeholder="例：行政大樓前花壇" 
              required 
              class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
            >
          </div>

          <!-- 花朵名稱 -->
          <div>
            <label for="flowerName" class="block text-xs font-semibold text-slate-700 mb-1">
              花朵名稱 <span class="text-red-500">*</span>
            </label>
            <input 
              type="text" 
              id="flowerName" 
              placeholder="例：平戶杜鵑" 
              required 
              class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
            >
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- 原生種 / 外來種 -->
          <div>
            <label for="speciesType" class="block text-xs font-semibold text-slate-700 mb-1">品種類別</label>
            <select id="speciesType" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
              <option value="原生種">原生種</option>
              <option value="外來種">外來種</option>
              <option value="不確定">不確定</option>
            </select>
          </div>

          <!-- 圖片網址 -->
          <div>
            <label for="imageUrl" class="block text-xs font-semibold text-slate-700 mb-1">圖片網址 (URL)</label>
            <input 
              type="url" 
              id="imageUrl" 
              placeholder="https://..." 
              class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
            >
          </div>
        </div>

        <!-- 外型特徵 -->
        <div>
          <label for="features" class="block text-xs font-semibold text-slate-700 mb-1">外型特徵</label>
          <input 
            type="text" 
            id="features" 
            placeholder="例：粉紅色花瓣、5瓣漏斗狀、葉片帶絨毛" 
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
          >
        </div>

        <!-- 備註 -->
        <div>
          <label for="note" class="block text-xs font-semibold text-slate-700 mb-1">備註說明</label>
          <textarea 
            id="note" 
            rows="2" 
            placeholder="備註生長狀況、昆蟲停留情形等..." 
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
          ></textarea>
        </div>
      </div>

      <!-- 提交按鈕 -->
      <div class="pt-2">
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition duration-200 flex justify-center items-center gap-2 cursor-pointer"
        >
          <span>提交送出 (Submit)</span>
        </button>
      </div>

    </form>

    <!-- 執行結果與回應訊息 -->
    <div id="resultContainer" class="hidden border-t border-slate-200 bg-slate-50 p-6">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">傳送狀態回報：</h3>
        <div id="statusBadge" class="px-2.5 py-0.5 text-xs font-semibold rounded-full"></div>
      </div>
      <pre id="responseOutput" class="bg-slate-900 text-emerald-400 p-4 rounded-xl text-xs overflow-x-auto font-mono max-h-48 leading-relaxed"></pre>
    </div>

  </div>

  <script>
    // 定義 localStorage 鍵名以儲存 Apps Script 網址
    const URL_STORAGE_KEY = 'gas_flower_obs_url';

    // 格式化當前時間 (YYYY-MM-DD HH:mm:ss)
    function getCurrentFormattedTime() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }

    // 自動獲取 GPS 定位
    function getGPSLocation() {
      const gpsInput = document.getElementById('gps');
      const gpsStatus = document.getElementById('gpsStatus');

      gpsInput.value = '';
      gpsStatus.className = 'text-[11px] text-amber-600 mt-1 font-medium';
      gpsStatus.textContent = '📡 正在取得 GPS 定位...';

      if (!navigator.geolocation) {
        gpsStatus.className = 'text-[11px] text-red-500 mt-1 font-medium';
        gpsStatus.textContent = '❌ 您的裝置不支援 GPS 定位功能';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude.toFixed(6);
          const lng = position.coords.longitude.toFixed(6);
          gpsInput.value = `${lat}, ${lng}`;
          gpsStatus.className = 'text-[11px] text-emerald-600 mt-1 font-medium';
          gpsStatus.textContent = '✅ 已成功定位';
        },
        (error) => {
          gpsStatus.className = 'text-[11px] text-red-500 mt-1 font-medium';
          switch (error.code) {
            case error.PERMISSION_DENIED:
              gpsStatus.textContent = '⚠️ 請允許網頁存取位置權限';
              break;
            case error.POSITION_UNAVAILABLE:
              gpsStatus.textContent = '⚠️ 無法取得目前位置';
              break;
            case error.TIMEOUT:
              gpsStatus.textContent = '⚠️ 定位請求逾時';
              break;
            default:
              gpsStatus.textContent = '⚠️ 獲取定位失敗';
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // 頁面開啟時的初始工作
    window.addEventListener('DOMContentLoaded', () => {
      // 1. 自動觸發 GPS 定位
      getGPSLocation();
      document.getElementById('reloactionBtn').addEventListener('click', getGPSLocation);

      // 2. 恢復上一次使用的 Apps Script 網址
      const savedUrl = localStorage.getItem(URL_STORAGE_KEY);
      if (savedUrl) {
        document.getElementById('webAppUrl').value = savedUrl;
      }
    });

    // 表單提交處理
    document.getElementById('observationForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const webAppUrl = document.getElementById('webAppUrl').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const resultContainer = document.getElementById('resultContainer');
      const statusBadge = document.getElementById('statusBadge');
      const responseOutput = document.getElementById('responseOutput');

      if (!webAppUrl) {
        alert('請先輸入 Google Apps Script 部署網址！');
        return;
      }

      // 儲存 Apps Script 網址供下次自動帶入
      localStorage.setItem(URL_STORAGE_KEY, webAppUrl);

      // 關鍵需求：在點擊提交按鈕的「瞬間」抓取當下的日期時間
      const currentDatetime = getCurrentFormattedTime();
      document.getElementById('timePreview').textContent = currentDatetime;

      // 構建傳送給 GAS 的 JSON 封包
      const payload = {
        datetime: currentDatetime,
        location: document.getElementById('location').value.trim(),
        gps: document.getElementById('gps').value.trim(),
        flowerName: document.getElementById('flowerName').value.trim(),
        imageUrl: document.getElementById('imageUrl').value.trim(),
        speciesType: document.getElementById('speciesType').value,
        features: document.getElementById('features').value.trim(),
        note: document.getElementById('note').value.trim()
      };

      // 按鈕狀態改為載入中
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
      submitBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg> 資料傳送中...
      `;

      resultContainer.classList.remove('hidden');
      statusBadge.className = "px-2.5 py-0.5 text-xs font-semibold rounded-full bg-amber-100 text-amber-800";
      statusBadge.textContent = "發送中...";
      responseOutput.textContent = "Payload:\n" + JSON.stringify(payload, null, 2);

      try {
        // 發送 POST 請求給 Google Apps Script (使用 text/plain 防止複雜跨網域 Preflight)
        const response = await fetch(webAppUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          statusBadge.className = "px-2.5 py-0.5 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-800";
          statusBadge.textContent = "✅ 成功寫入試算表";
        } else {
          statusBadge.className = "px-2.5 py-0.5 text-xs font-semibold rounded-full bg-red-100 text-red-800";
          statusBadge.textContent = "❌ 傳回錯誤";
        }

        responseOutput.textContent = "伺服器回應:\n" + JSON.stringify(result, null, 2) + "\n\n傳送資料內容:\n" + JSON.stringify(payload, null, 2);

      } catch (error) {
        statusBadge.className = "px-2.5 py-0.5 text-xs font-semibold rounded-full bg-red-100 text-red-800";
        statusBadge.textContent = "❌ 連線失敗 / CORS 錯誤";
        responseOutput.textContent = `錯誤訊息: ${error.message}\n\n可能原因與檢查點：\n1. Google Apps Script 部署時「誰有權存取」未設定為「所有人 (Anyone)」\n2. 程式碼更新後沒有選擇「新版本」重新部署\n3. Web App 網址輸入錯誤`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        submitBtn.innerHTML = "<span>提交送出 (Submit)</span>";
      }
    });
  </script>
</body>
</html>
